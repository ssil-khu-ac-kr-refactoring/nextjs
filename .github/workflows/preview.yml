name: Build PR preview

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-image:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SSIL_PREVIEW_IMAGE: ghcr.io/${{ github.repository }}-preview:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      SSIL_PREVIEW_PR: ${{ github.event.pull_request.number }}
      SSIL_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image for the PR merge candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.SSIL_PREVIEW_IMAGE }}
          cache-from: type=gha,scope=pr-preview
          cache-to: type=gha,scope=pr-preview,mode=max

      - name: Smoke test the isolated preview
        run: sh ops/preview/smoke-test.sh

      - name: Log in to preview registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish preview image
        run: docker push "$SSIL_PREVIEW_IMAGE"
