name: Build image (GHCR) & deploy to NAS

# master에 push되면 GitHub Actions 러너(메모리 충분)에서 Docker 이미지를 빌드해
# GHCR로 push한 뒤, NAS에 webhook을 보내 pull/restart만 하도록 한다.
# (NAS에서 next build를 직접 돌리다 OOM나는 문제 해결)

on:
  workflow_dispatch:
  push:
    branches: ["master", "main"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-nas:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NAS pull & restart
        # NAS의 /deploy 핸들러는 `docker compose pull && docker compose up -d`만 수행.
        # 토큰/URL은 GitHub Secrets(DEPLOY_TOKEN, DEPLOY_URL)에서 주입한다.
        # ⚠️ 과거 평문 토큰(my-secret-token)이 공개 히스토리에 남아있으니 반드시 회전할 것.
        # -f: HTTP 4xx/5xx에서 잡을 실패시킴(터널 죽었는데 초록불로 표시되는 문제 방지).
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ] || [ -z "$DEPLOY_URL" ]; then
            echo "::error::DEPLOY_TOKEN / DEPLOY_URL secrets 미설정 — 배포 webhook 생략"
            exit 1
          fi
          curl -fsS -X POST \
            -H "X-DEPLOY-TOKEN: $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"master"}' \
            "$DEPLOY_URL"
